[plugin]

name="PathStitcher"
description="Stitches modular building blocks along any Path3D, wedging and shearing each block so joints meet exactly. Sections with First and Last blocks and a repeating or randomized pattern, markers, GPU-instanced drawing, PathSpiral and PathCircle paths, collision, and a ground draper. Set it all up in the BUILDING BLOCKS Inspector panel."
author="Rufus Lane"
version="1.0.0"
script="plugin.gd"
